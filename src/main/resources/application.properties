spring.application.name=rabbitmq-admin-service

# Puerto propio del Admin Service
server.port=8082

# Conexion con RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Colas de Pedidos360
pedidos360.rabbitmq.queue=pedidos.pedido-creado.q
pedidos360.rabbitmq.dead-letter-queue=pedidos.pedido-creado.dlq

# Reprocesamiento de mensajes
pedidos360.rabbitmq.exchange=pedidos360.events
pedidos360.rabbitmq.routing-key=pedido.creado

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always